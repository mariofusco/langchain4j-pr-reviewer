# Framework chatter stays out of the console; the reviewer's own progress and the usage log are kept.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.dev.langchain4j.prreviewer=info
org.slf4j.simpleLogger.log.dev.langchain4j.agentic.patterns.decisionrouter=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
