# ---------------------------------------------------------------------------------------------------------------------
# Defaults of the review options: the CLI flags and the web form override them per review
# ---------------------------------------------------------------------------------------------------------------------
reviewer.provider=anthropic
reviewer.decision-model=local
# empty: 0.2 for the local decision model, 0.5 for the hosted ones
reviewer.router-threshold=
reviewer.mode=auto
reviewer.deep=false
reviewer.max-cost=2.0
reviewer.max-debates=3
reviewer.max-files=50
reviewer.max-diff-tokens=60000
reviewer.max-chunks=4
reviewer.output-dir=review-output

# ---------------------------------------------------------------------------------------------------------------------
# Chat models: one named configuration per provider and tier (small, medium, large), selected per agent and review
# by ModelSelection. A provider without its key gets a placeholder key: the application starts, and the CLI and the
# web form refuse that provider.
# ---------------------------------------------------------------------------------------------------------------------

# the planner agents (router, debate, voting) require a default chat model, which they never call
quarkus.langchain4j.chat-model.provider=anthropic
# tool loops of the agents: the context gatherer may call its tools 12 times, be refused once, then answer; past this
# number of round trips the invocation fails (default: 10). The agents read this property, not max-tool-calling-round-trips.
quarkus.langchain4j.ai-service.max-tool-executions=16
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:missing}
quarkus.langchain4j.anthropic.chat-model.model-name=claude-haiku-5-5

# Anthropic: thinking is left to its default (adaptive on the 5.x models) and its blocks are returned and sent back,
# as tool loops require; no sampling parameters; the output budget includes thinking
quarkus.langchain4j.anthropic-economy.chat-model.provider=anthropic
quarkus.langchain4j.anthropic.anthropic-economy.api-key=${ANTHROPIC_API_KEY:missing}
quarkus.langchain4j.anthropic.anthropic-economy.timeout=10m
quarkus.langchain4j.anthropic.anthropic-economy.chat-model.model-name=claude-haiku-5-5
quarkus.langchain4j.anthropic.anthropic-economy.chat-model.max-tokens=16000
quarkus.langchain4j.anthropic.anthropic-economy.chat-model.max-retries=2
quarkus.langchain4j.anthropic.anthropic-economy.chat-model.thinking.return-thinking=true
quarkus.langchain4j.anthropic.anthropic-economy.chat-model.thinking.send-thinking=true
quarkus.langchain4j.anthropic.anthropic-economy.chat-model.cache-system-messages=true
quarkus.langchain4j.anthropic.anthropic-economy.chat-model.cache-tools=true

quarkus.langchain4j.anthropic-standard.chat-model.provider=anthropic
quarkus.langchain4j.anthropic.anthropic-standard.api-key=${ANTHROPIC_API_KEY:missing}
quarkus.langchain4j.anthropic.anthropic-standard.timeout=10m
quarkus.langchain4j.anthropic.anthropic-standard.chat-model.model-name=claude-sonnet-5-5
quarkus.langchain4j.anthropic.anthropic-standard.chat-model.max-tokens=32000
quarkus.langchain4j.anthropic.anthropic-standard.chat-model.max-retries=2
quarkus.langchain4j.anthropic.anthropic-standard.chat-model.thinking.return-thinking=true
quarkus.langchain4j.anthropic.anthropic-standard.chat-model.thinking.send-thinking=true
quarkus.langchain4j.anthropic.anthropic-standard.chat-model.cache-system-messages=true
quarkus.langchain4j.anthropic.anthropic-standard.chat-model.cache-tools=true

quarkus.langchain4j.anthropic-premium.chat-model.provider=anthropic
quarkus.langchain4j.anthropic.anthropic-premium.api-key=${ANTHROPIC_API_KEY:missing}
quarkus.langchain4j.anthropic.anthropic-premium.timeout=10m
quarkus.langchain4j.anthropic.anthropic-premium.chat-model.model-name=claude-opus-5-5
quarkus.langchain4j.anthropic.anthropic-premium.chat-model.max-tokens=32000
quarkus.langchain4j.anthropic.anthropic-premium.chat-model.max-retries=2
quarkus.langchain4j.anthropic.anthropic-premium.chat-model.thinking.return-thinking=true
quarkus.langchain4j.anthropic.anthropic-premium.chat-model.thinking.send-thinking=true
quarkus.langchain4j.anthropic.anthropic-premium.chat-model.cache-system-messages=true
quarkus.langchain4j.anthropic.anthropic-premium.chat-model.cache-tools=true

# OpenAI: reasoning effort grows with the tier; the tool variants use effort "none", because gpt-5.6-luna and gpt-5.1
# reject function tools combined with a reasoning effort (gpt-5-nano has no "none": its tool agents use the plain tier)
quarkus.langchain4j.openai-economy.chat-model.provider=openai
quarkus.langchain4j.openai.openai-economy.api-key=${OPENAI_API_KEY:missing}
quarkus.langchain4j.openai.openai-economy.timeout=10m
quarkus.langchain4j.openai.openai-economy.max-retries=2
quarkus.langchain4j.openai.openai-economy.chat-model.model-name=gpt-5-nano
quarkus.langchain4j.openai.openai-economy.chat-model.reasoning-effort=low
quarkus.langchain4j.openai.openai-economy.chat-model.max-completion-tokens=16000
quarkus.langchain4j.openai.openai-economy.chat-model.strict-json-schema=true

quarkus.langchain4j.openai-standard.chat-model.provider=openai
quarkus.langchain4j.openai.openai-standard.api-key=${OPENAI_API_KEY:missing}
quarkus.langchain4j.openai.openai-standard.timeout=10m
quarkus.langchain4j.openai.openai-standard.max-retries=2
quarkus.langchain4j.openai.openai-standard.chat-model.model-name=gpt-5.6-luna
quarkus.langchain4j.openai.openai-standard.chat-model.reasoning-effort=medium
quarkus.langchain4j.openai.openai-standard.chat-model.max-completion-tokens=64000
quarkus.langchain4j.openai.openai-standard.chat-model.strict-json-schema=true

quarkus.langchain4j.openai-premium.chat-model.provider=openai
quarkus.langchain4j.openai.openai-premium.api-key=${OPENAI_API_KEY:missing}
quarkus.langchain4j.openai.openai-premium.timeout=10m
quarkus.langchain4j.openai.openai-premium.max-retries=2
quarkus.langchain4j.openai.openai-premium.chat-model.model-name=gpt-5.1
quarkus.langchain4j.openai.openai-premium.chat-model.reasoning-effort=high
quarkus.langchain4j.openai.openai-premium.chat-model.max-completion-tokens=64000
quarkus.langchain4j.openai.openai-premium.chat-model.strict-json-schema=true

quarkus.langchain4j.openai-standard-tools.chat-model.provider=openai
quarkus.langchain4j.openai.openai-standard-tools.api-key=${OPENAI_API_KEY:missing}
quarkus.langchain4j.openai.openai-standard-tools.timeout=10m
quarkus.langchain4j.openai.openai-standard-tools.max-retries=2
quarkus.langchain4j.openai.openai-standard-tools.chat-model.model-name=gpt-5.6-luna
quarkus.langchain4j.openai.openai-standard-tools.chat-model.reasoning-effort=none
quarkus.langchain4j.openai.openai-standard-tools.chat-model.max-completion-tokens=64000
quarkus.langchain4j.openai.openai-standard-tools.chat-model.strict-json-schema=true

quarkus.langchain4j.openai-premium-tools.chat-model.provider=openai
quarkus.langchain4j.openai.openai-premium-tools.api-key=${OPENAI_API_KEY:missing}
quarkus.langchain4j.openai.openai-premium-tools.timeout=10m
quarkus.langchain4j.openai.openai-premium-tools.max-retries=2
quarkus.langchain4j.openai.openai-premium-tools.chat-model.model-name=gpt-5.1
quarkus.langchain4j.openai.openai-premium-tools.chat-model.reasoning-effort=none
quarkus.langchain4j.openai.openai-premium-tools.chat-model.max-completion-tokens=64000
quarkus.langchain4j.openai.openai-premium-tools.chat-model.strict-json-schema=true

# ---------------------------------------------------------------------------------------------------------------------
# Decision models of the reviewer router (System One API): local server, hosted TypeSafe, OpenRouter
# ---------------------------------------------------------------------------------------------------------------------
quarkus.langchain4j.local.decision-model.provider=typesafe
quarkus.langchain4j.typesafe.local.base-url=${SYSTEM_ONE_BASE_URL:http://localhost:11434}
quarkus.langchain4j.typesafe.local.timeout=30s
quarkus.langchain4j.typesafe.local.decision-model.model-name=${SYSTEM_ONE_MODEL_NAME:tev1:0.8b}

quarkus.langchain4j.hosted.decision-model.provider=typesafe
quarkus.langchain4j.typesafe.hosted.api-key=${TYPESAFE_API_KEY:missing}
quarkus.langchain4j.typesafe.hosted.timeout=30s
quarkus.langchain4j.typesafe.hosted.decision-model.model-name=${TYPESAFE_MODEL_NAME:jev-latest}

quarkus.langchain4j.openrouter.decision-model.provider=typesafe
quarkus.langchain4j.typesafe.openrouter.base-url=https://openrouter.ai/api/
quarkus.langchain4j.typesafe.openrouter.api-key=${OPENROUTER_API_KEY:missing}
quarkus.langchain4j.typesafe.openrouter.timeout=30s
quarkus.langchain4j.typesafe.openrouter.decision-model.model-name=${OPENROUTER_DECISION_MODEL:typesafe/jev-1.13}

# ---------------------------------------------------------------------------------------------------------------------
# GitHub is read through the hub4j client (quarkus-github-api), built on first use with github.token, which comes
# from GITHUB_TOKEN, else from `gh auth token` (ReviewerConfigSource). No property to set.
# ---------------------------------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------------------------------
# Command line: every command but `serve` runs with the cli profile (set by PrReviewerMain)
# ---------------------------------------------------------------------------------------------------------------------
%cli.quarkus.http.host-enabled=false
%cli.quarkus.banner.enabled=false
%cli.quarkus.log.level=WARN
# stdout belongs to the commands (the completion script, the summary)
%cli.quarkus.log.console.stderr=true
# the only knob the agents read for their tool round trips is a deprecated property: no warning on every command
%cli.quarkus.log.category."io.quarkus.config".level=ERROR

# ---------------------------------------------------------------------------------------------------------------------
# Packaging
# ---------------------------------------------------------------------------------------------------------------------
quarkus.package.jar.type=uber-jar

# the web interface serves this machine only
quarkus.http.host=127.0.0.1

# tests write their reports under target/
%test.reviewer.output-dir=target/test-review-output
