<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="Reviewer routing: routingInputs turns the triage and the diff into flags; reviewPanel, a planner agent with the DecisionRouterPlanner, asks the decision model one yes/no question per reviewer and runs the selected reviewers in parallel; coverageFloor then runs the fallback reviewers the router skipped; largeDiffGate maps a chunk reviewer over the files left out of the diff; all findings go to findingsConsolidator.">
<title>Reviewer routing: routingInputs turns the triage and the diff into flags; reviewPanel, a planner agent with the DecisionRouterPlanner, asks the decision model one yes/no question per reviewer and runs the selected reviewers in parallel; coverageFloor then runs the fallback reviewers the router skipped; largeDiffGate maps a chunk reviewer over the files left out of the diff; all findings go to findingsConsolidator.</title>
<style>
.bg{fill:#ffffff}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:11px;fill:#1f2328}
.n{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px}
.h{font-weight:600}
.r{font-weight:400}
.s,.p,.l{fill:#59636e}
.s{font-size:10.5px}
.p{font-style:italic;font-size:10.5px}
.k{font-size:10px;letter-spacing:.08em;fill:#59636e;font-weight:600}
.box{fill:#f6f8fa;stroke:#6e7781}
.code{stroke-dasharray:4 3}
.grp{fill:none;stroke:#afb8c1}
.lane{fill:#f6f8fa;stroke:none}
.ghost{fill:none;stroke-dasharray:3 3}
.e{fill:none;stroke:#6e7781;stroke-width:1.2}
.ah{fill:#6e7781}
.acc.box{fill:#ddf4ff;stroke:#0969da}
.acc.grp,.acc.ghost,.acc.e{stroke:#0969da}
.acc.ghost{fill:none}
.acc.ah,text.acc{fill:#0969da}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}
text{fill:#e6edf3}
.s,.p,.l,.k{fill:#9198a1}
.box{fill:#161b22;stroke:#8b949e}
.grp{stroke:#3d444d}
.lane{fill:#151b23}
.e{stroke:#8b949e}
.ah{fill:#8b949e}
.acc.box{fill:#0f2541;stroke:#4493f8}
.acc.grp,.acc.ghost,.acc.e{stroke:#4493f8}
.acc.ah,text.acc{fill:#4493f8}
.acc.ghost{fill:none}
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah acc"/></marker>
</defs>
<rect width="860" height="470" class="bg"/>
<rect x="20" y="92" width="120" height="44" rx="4" class="box code"/>
<text x="80" y="111" class="n" text-anchor="middle">routingInputs</text>
<text x="80" y="124" class="s" text-anchor="middle">flags</text>
<rect x="180" y="20" width="330" height="300" rx="6" class="grp"/>
<text x="190" y="37" class="n h">reviewPanel</text>
<text x="500" y="37" class="p" text-anchor="end">@PlannerAgent</text>
<text x="190" y="51" class="s">DecisionRouterPlanner</text>
<rect x="196" y="70" width="298" height="44" rx="4" class="lane"/>
<text x="345" y="89" class="h" text-anchor="middle">decision model</text>
<text x="345" y="102" class="s" text-anchor="middle">one yes/no per reviewer, in one call</text>
<polyline points="140,114 194,100" class="e" marker-end="url(#a)"/>
<text x="166" y="100" class="l" text-anchor="middle">flags</text>
<polyline points="220,114 220,292" class="e"/>
<rect x="250" y="150" width="180" height="24" rx="4" class="box"/>
<text x="340" y="165.5" class="n" text-anchor="middle">correctnessReviewer</text>
<polyline points="220,162 248,162" class="e" marker-end="url(#a)"/>
<rect x="250" y="180" width="180" height="24" rx="4" class="box"/>
<text x="340" y="195.5" class="n" text-anchor="middle">securityReviewer</text>
<polyline points="220,192 248,192" class="e" marker-end="url(#a)"/>
<rect x="250" y="210" width="180" height="24" rx="4" class="box"/>
<text x="340" y="225.5" class="n" text-anchor="middle">designReviewer</text>
<polyline points="220,222 248,222" class="e" marker-end="url(#a)"/>
<rect x="250" y="240" width="180" height="24" rx="4" class="box"/>
<text x="340" y="255.5" class="n" text-anchor="middle">testReviewer</text>
<polyline points="220,252 248,252" class="e" marker-end="url(#a)"/>
<rect x="250" y="270" width="180" height="24" rx="4" class="box"/>
<text x="340" y="285.5" class="n" text-anchor="middle">docsApiReviewer</text>
<polyline points="220,282 248,282" class="e" marker-end="url(#a)"/>
<text x="228" y="136" class="l">p(yes) ≥ threshold: run in parallel</text>
<rect x="560" y="20" width="280" height="206" rx="6" class="grp acc"/>
<text x="570" y="37" class="n h">coverageFloor</text>
<text x="830" y="37" class="p" text-anchor="end">@ConditionalAgent</text>
<text x="570" y="51" class="s">fallback for each essential reviewer skipped</text>
<rect x="576" y="64" width="248" height="42" rx="4" class="box acc"/>
<text x="700" y="82" class="n" text-anchor="middle">correctnessReviewerFallback</text>
<text x="700" y="95" class="s" text-anchor="middle">production code changed</text>
<rect x="576" y="114" width="248" height="42" rx="4" class="box acc"/>
<text x="700" y="132" class="n" text-anchor="middle">securityReviewerFallback</text>
<text x="700" y="145" class="s" text-anchor="middle">security-sensitive change</text>
<rect x="576" y="164" width="248" height="42" rx="4" class="box acc"/>
<text x="700" y="182" class="n" text-anchor="middle">docsApiReviewerFallback</text>
<text x="700" y="195" class="s" text-anchor="middle">documentation-only change</text>
<polyline points="510,110 558,110" class="e" marker-end="url(#a)"/>
<text x="534" y="104" class="l" text-anchor="middle">who ran</text>
<rect x="600" y="252" width="240" height="126" rx="6" class="grp"/>
<text x="610" y="269" class="n h">largeDiffGate</text>
<text x="830" y="269" class="p" text-anchor="end">@ConditionalAgent</text>
<text x="610" y="283" class="s">files left out of the main diff</text>
<rect x="612" y="292" width="216" height="76" rx="6" class="grp"/>
<text x="622" y="309" class="n h">chunkedReview</text>
<text x="622" y="323" class="p">@ParallelMapperAgent</text>
<rect x="624" y="332" width="120" height="26" rx="4" class="box"/>
<text x="684" y="348.5" class="n" text-anchor="middle">chunkReviewer</text>
<text x="752" y="349" class="s">× diffChunks</text>
<polyline points="720,226 720,250" class="e" marker-end="url(#a)"/>
<rect x="180" y="404" width="660" height="32" rx="4" class="box code"/>
<text x="510" y="423.5" class="n" text-anchor="middle">findingsConsolidator</text>
<polyline points="345,320 345,402" class="e" marker-end="url(#a)"/>
<text x="351" y="366" class="l">findings</text>
<polyline points="580,226 580,402" class="e" marker-end="url(#a)"/>
<text x="574" y="366" class="l" text-anchor="end">findings</text>
<polyline points="720,378 720,402" class="e" marker-end="url(#a)"/>
<text x="726" y="394" class="l">findings</text>
<rect x="20" y="449" width="22" height="12" rx="3" class="box"/>
<text x="48" y="459" class="s">AI agent</text>
<rect x="114.8" y="449" width="22" height="12" rx="3" class="box code"/>
<text x="142.8" y="459" class="s">non-AI agent</text>
<rect x="232" y="449" width="22" height="12" rx="3" class="grp"/>
<text x="260" y="459" class="s">composed agent and its pattern</text>
</svg>
