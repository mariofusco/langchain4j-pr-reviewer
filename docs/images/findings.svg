<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" width="860" height="530" role="img" aria-label="Findings: findingsConsolidator validates the location of every raw finding, merges duplicates, numbers them and queues the doubtful ones; in each pass of reviewRevisionLoop, debateGate runs contestedDebates over the queue, where findingDebate, a planner agent with the DebatePlanner, lets a prosecutor and a defender argue with read-only tools before the judge decides; debateBudgetGuard marks what is left as unsure and activeFindingsSelector drops rejected findings.">
<title>Findings: findingsConsolidator validates the location of every raw finding, merges duplicates, numbers them and queues the doubtful ones; in each pass of reviewRevisionLoop, debateGate runs contestedDebates over the queue, where findingDebate, a planner agent with the DebatePlanner, lets a prosecutor and a defender argue with read-only tools before the judge decides; debateBudgetGuard marks what is left as unsure and activeFindingsSelector drops rejected findings.</title>
<style>
.bg{fill:#ffffff}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:11px;fill:#1f2328}
.n{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px}
.h{font-weight:600}
.r{font-weight:400}
.s,.p,.l{fill:#59636e}
.s{font-size:10.5px}
.p{font-style:italic;font-size:10.5px}
.k{font-size:10px;letter-spacing:.08em;fill:#59636e;font-weight:600}
.box{fill:#f6f8fa;stroke:#6e7781}
.code{stroke-dasharray:4 3}
.grp{fill:none;stroke:#afb8c1}
.lane{fill:#f6f8fa;stroke:none}
.ghost{fill:none;stroke-dasharray:3 3}
.e{fill:none;stroke:#6e7781;stroke-width:1.2}
.ah{fill:#6e7781}
.acc.box{fill:#ddf4ff;stroke:#0969da}
.acc.grp,.acc.ghost,.acc.e{stroke:#0969da}
.acc.ghost{fill:none}
.acc.ah,text.acc{fill:#0969da}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}
text{fill:#e6edf3}
.s,.p,.l,.k{fill:#9198a1}
.box{fill:#161b22;stroke:#8b949e}
.grp{stroke:#3d444d}
.lane{fill:#151b23}
.e{stroke:#8b949e}
.ah{fill:#8b949e}
.acc.box{fill:#0f2541;stroke:#4493f8}
.acc.grp,.acc.ghost,.acc.e{stroke:#4493f8}
.acc.ah,text.acc{fill:#4493f8}
.acc.ghost{fill:none}
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah acc"/></marker>
</defs>
<rect width="860" height="530" class="bg"/>
<rect x="20" y="52" width="130" height="44" rx="4" class="lane"/>
<text x="85" y="71" class="h" text-anchor="middle">reviewers</text>
<text x="85" y="84" class="s" text-anchor="middle">panel, floor, chunks</text>
<rect x="200" y="20" width="340" height="120" rx="4" class="box code"/>
<text x="212" y="40" class="n h">findingsConsolidator</text>
<text x="212" y="62" class="s">1  file of the diff, within ±3 lines of a hunk</text>
<text x="212" y="77" class="s">2  merge duplicates: same category, ±2 lines</text>
<text x="212" y="92" class="s">3  identify F1..Fn</text>
<text x="212" y="107" class="s">4  contest HIGH+ findings with confidence &lt; 0.8,</text>
<text x="212" y="122" class="s">    or contradicted at the same place</text>
<polyline points="150,74 198,74" class="e" marker-end="url(#a)"/>
<text x="174" y="68" class="l" text-anchor="middle">raw</text>
<rect x="600" y="58" width="240" height="44" rx="4" class="lane"/>
<text x="720" y="77" class="h" text-anchor="middle">Limitations</text>
<text x="720" y="90" class="s" text-anchor="middle">in the report</text>
<polyline points="540,80 598,80" class="e" marker-end="url(#a)"/>
<text x="569" y="74" class="l" text-anchor="middle">invalid</text>
<polyline points="300,140 300,214" class="e" marker-end="url(#a)"/>
<text x="306" y="166" class="l">Findings F1..Fn</text>
<polyline points="460,140 460,214" class="e" marker-end="url(#a)"/>
<text x="466" y="166" class="l">contested queue, ≤ --max-debates</text>
<rect x="20" y="180" width="820" height="306" rx="6" class="grp"/>
<text x="30" y="197" class="n h">reviewRevisionLoop</text>
<text x="830" y="197" class="p" text-anchor="end">@LoopAgent · first steps of every pass</text>
<rect x="36" y="216" width="620" height="254" rx="6" class="grp"/>
<text x="46" y="233" class="n h">debateGate</text>
<text x="646" y="233" class="p" text-anchor="end">@ConditionalAgent</text>
<text x="46" y="247" class="s">queue not empty, within the cost cap</text>
<rect x="52" y="258" width="588" height="200" rx="6" class="grp"/>
<text x="62" y="275" class="n h">contestedDebates</text>
<text x="630" y="275" class="p" text-anchor="end">@LoopAgent · one finding per iteration</text>
<rect x="66" y="330" width="112" height="28" rx="4" class="box code"/>
<text x="122" y="347.5" class="n" text-anchor="middle">nextContested</text>
<rect x="196" y="290" width="280" height="132" rx="6" class="grp acc"/>
<text x="206" y="307" class="n h">findingDebate</text>
<text x="466" y="307" class="p" text-anchor="end">@PlannerAgent · DebatePlanner</text>
<rect x="210" y="320" width="140" height="26" rx="4" class="box acc"/>
<text x="280" y="336.5" class="n" text-anchor="middle">findingProsecutor</text>
<rect x="210" y="354" width="140" height="26" rx="4" class="box acc"/>
<text x="280" y="370.5" class="n" text-anchor="middle">findingDefender</text>
<text x="210" y="398" class="s">in parallel, 2 rounds, read-only</text>
<text x="210" y="411" class="s">MCP tools on the file's changes</text>
<rect x="374" y="334" width="90" height="32" rx="4" class="box acc"/>
<text x="419" y="353.5" class="n" text-anchor="middle">debateJudge</text>
<polyline points="350,333 372,344" class="e acc" marker-end="url(#aa)"/>
<polyline points="350,367 372,356" class="e acc" marker-end="url(#aa)"/>
<rect x="494" y="330" width="136" height="28" rx="4" class="box code"/>
<text x="562" y="347.5" class="n" text-anchor="middle">applyDebateVerdict</text>
<polyline points="178,344 194,344" class="e" marker-end="url(#a)"/>
<polyline points="464,344 492,344" class="e" marker-end="url(#a)"/>
<text x="552" y="376" class="s" text-anchor="middle">CONFIRMED, REJECTED</text>
<text x="552" y="389" class="s" text-anchor="middle">or UNSURE; severity</text>
<text x="552" y="402" class="s" text-anchor="middle">may be lowered</text>
<polyline points="612,358 612,440 122,440 122,360" class="e" marker-end="url(#a)"/>
<text x="367" y="435" class="l" text-anchor="middle">next contested finding</text>
<rect x="668" y="236" width="164" height="44" rx="4" class="box code"/>
<text x="750" y="255" class="n" text-anchor="middle">debateBudgetGuard</text>
<text x="750" y="268" class="s" text-anchor="middle">leftovers become UNSURE</text>
<rect x="668" y="320" width="164" height="44" rx="4" class="box code"/>
<text x="750" y="339" class="n" text-anchor="middle">activeFindingsSelector</text>
<text x="750" y="352" class="s" text-anchor="middle">drops REJECTED</text>
<polyline points="656,258 666,258" class="e" marker-end="url(#a)"/>
<polyline points="750,280 750,318" class="e" marker-end="url(#a)"/>
<polyline points="750,364 750,412" class="e" marker-end="url(#a)"/>
<text x="750" y="428" class="h" text-anchor="middle">ActiveFindings</text>
<text x="750" y="442" class="s" text-anchor="middle">to the scorer</text>
<rect x="20" y="503" width="22" height="12" rx="3" class="box"/>
<text x="48" y="513" class="s">AI agent</text>
<rect x="114.8" y="503" width="22" height="12" rx="3" class="box code"/>
<text x="142.8" y="513" class="s">non-AI agent</text>
<rect x="232" y="503" width="22" height="12" rx="3" class="grp"/>
<text x="260" y="513" class="s">composed agent and its pattern</text>
</svg>
