<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="Scores and verdict: the scorer proposes a score card; votingGate runs scoreVoting, a planner agent with the VotingPlanner over three scorers, only for a borderline card within the cost cap; scoreCalibrator then only lowers scores through caps and raises the verdict to the floor the credible findings require.">
<title>Scores and verdict: the scorer proposes a score card; votingGate runs scoreVoting, a planner agent with the VotingPlanner over three scorers, only for a borderline card within the cost cap; scoreCalibrator then only lowers scores through caps and raises the verdict to the floor the credible findings require.</title>
<style>
.bg{fill:#ffffff}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:11px;fill:#1f2328}
.n{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px}
.h{font-weight:600}
.r{font-weight:400}
.s,.p,.l{fill:#59636e}
.s{font-size:10.5px}
.p{font-style:italic;font-size:10.5px}
.k{font-size:10px;letter-spacing:.08em;fill:#59636e;font-weight:600}
.box{fill:#f6f8fa;stroke:#6e7781}
.code{stroke-dasharray:4 3}
.grp{fill:none;stroke:#afb8c1}
.lane{fill:#f6f8fa;stroke:none}
.ghost{fill:none;stroke-dasharray:3 3}
.e{fill:none;stroke:#6e7781;stroke-width:1.2}
.ah{fill:#6e7781}
.acc.box{fill:#ddf4ff;stroke:#0969da}
.acc.grp,.acc.ghost,.acc.e{stroke:#0969da}
.acc.ghost{fill:none}
.acc.ah,text.acc{fill:#0969da}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}
text{fill:#e6edf3}
.s,.p,.l,.k{fill:#9198a1}
.box{fill:#161b22;stroke:#8b949e}
.grp{stroke:#3d444d}
.lane{fill:#151b23}
.e{stroke:#8b949e}
.ah{fill:#8b949e}
.acc.box{fill:#0f2541;stroke:#4493f8}
.acc.grp,.acc.ghost,.acc.e{stroke:#4493f8}
.acc.ah,text.acc{fill:#4493f8}
.acc.ghost{fill:none}
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah acc"/></marker>
</defs>
<rect width="860" height="320" class="bg"/>
<rect x="20" y="120" width="130" height="56" rx="4" class="box"/>
<text x="85" y="138.5" class="n" text-anchor="middle">scorer</text>
<text x="85" y="151.5" class="s" text-anchor="middle">metrics, verdict,</text>
<text x="85" y="164.5" class="s" text-anchor="middle">reasoning</text>
<polyline points="85,222 85,178" class="e" marker-end="url(#a)"/>
<text x="85" y="236" class="s" text-anchor="middle">activeFindings</text>
<rect x="200" y="60" width="320" height="196" rx="6" class="grp"/>
<text x="210" y="77" class="n h">votingGate</text>
<text x="510" y="77" class="p" text-anchor="end">@ConditionalAgent</text>
<text x="210" y="91" class="s">borderline card, within the cost cap</text>
<rect x="216" y="104" width="288" height="138" rx="6" class="grp"/>
<text x="226" y="121" class="n h">scoreVoting</text>
<text x="494" y="121" class="p" text-anchor="end">@PlannerAgent · VotingPlanner</text>
<rect x="230" y="130" width="130" height="26" rx="4" class="box"/>
<text x="295" y="146.5" class="n" text-anchor="middle">neutralScorer</text>
<polyline points="360,143 392,176" class="e" marker-end="url(#a)"/>
<rect x="230" y="164" width="130" height="26" rx="4" class="box"/>
<text x="295" y="180.5" class="n" text-anchor="middle">skepticalScorer</text>
<polyline points="360,177 392,176" class="e" marker-end="url(#a)"/>
<rect x="230" y="198" width="130" height="26" rx="4" class="box"/>
<text x="295" y="214.5" class="n" text-anchor="middle">lenientScorer</text>
<polyline points="360,211 392,176" class="e" marker-end="url(#a)"/>
<text x="398" y="173" class="s">mean metrics,</text>
<text x="398" y="186" class="s">majority verdict</text>
<polyline points="150,148 198,148" class="e" marker-end="url(#a)"/>
<text x="174" y="142" class="l" text-anchor="middle">card</text>
<polyline points="120,120 120,36 700,36 700,58" class="e" marker-end="url(#a)"/>
<text x="410" y="30" class="l" text-anchor="middle">not borderline: card unchanged</text>
<polyline points="520,176 558,176" class="e" marker-end="url(#a)"/>
<text x="539" y="170" class="l" text-anchor="middle">card</text>
<rect x="560" y="60" width="280" height="232" rx="4" class="box code acc"/>
<text x="572" y="80" class="n h">scoreCalibrator</text>
<text x="572" y="106" class="h">caps, only downwards</text>
<text x="572" y="121" class="s">security ≤ 2 on a critical, ≤ 5 on a high</text>
<text x="572" y="136" class="s">correctness ≤ 3 on a critical, ≤ 5 on a high</text>
<text x="572" y="151" class="s">test coverage ≤ 4: bug fix or feature</text>
<text x="572" y="166" class="s">    without test changes</text>
<text x="572" y="185" class="h">verdict floor</text>
<text x="572" y="200" class="s">REQUEST_CHANGES: credible HIGH+</text>
<text x="572" y="215" class="s">    correctness or security finding</text>
<text x="572" y="230" class="s">COMMENT: any active MEDIUM+ finding</text>
<text x="572" y="245" class="s">verdict = stricter(proposed, floor)</text>
<text x="572" y="260" class="p">credible: CONFIRMED, or UNVERIFIED with</text>
<text x="572" y="275" class="p">    confidence ≥ 0.7; UNSURE never counts</text>
<polyline points="700,292 700,312" class="e" marker-end="url(#a)"/>
<text x="692" y="310" class="s" text-anchor="end">Scores and verdict to the report</text>
<rect x="20" y="299" width="22" height="12" rx="3" class="box"/>
<text x="48" y="309" class="s">AI agent</text>
<rect x="114.8" y="299" width="22" height="12" rx="3" class="box code"/>
<text x="142.8" y="309" class="s">non-AI agent</text>
<rect x="232" y="299" width="22" height="12" rx="3" class="grp"/>
<text x="260" y="309" class="s">composed agent and its pattern</text>
</svg>
